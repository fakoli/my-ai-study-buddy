name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      # Run the full suite from a clean env (no ambient DEBUG) to prove the
      # suite is hermetic (ticket 006 / OX Alpha finding 6). No pipe: the
      # step's exit code must be pytest's so red tests fail the job.
      - name: Run backend test suite
        run: env -u DEBUG uv run pytest tests/ -q --cov=. --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run frontend test suite
        run: npm run test

      # Lint is intentionally non-blocking until ticket 005 (pre-existing
      # frontend eslint errors) lands; failures still surface in the job log.
      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true
